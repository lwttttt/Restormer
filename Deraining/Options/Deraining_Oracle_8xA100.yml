# ---------------------------------------------------------------
# Oracle UpperBound 实验: 内置 RainPredictor + 多级 FiLM 条件注入
#
# 目的: 验证当 RainPredictor 通过 CE loss 学习正确的雨纹分类时,
#       去雨效果能提升多少? Oracle - Baseline 的 PSNR 差 = 理论增益上限。
#
# 与 Baseline 的区别:
#   - 训练集配了 target_labels_path, CE loss 引导内置 RainPredictor 学习正确分类
#   - L1 像素 loss + lambda_rain * CE 蒸馏 loss
#   - 内置 RainPredictor 预测 → softmax → 3 级 FiLM (L1/L2/L3) 调制 encoder 特征
#
# 训练环境: 8x A100 (80GB)
# 数据集: sampled_dataset_balanced (7个去雨数据集的平衡采样)
# 训练集: ~7361 对图像 (AllRain)
# 验证集: 使用 RainDS-Syn 测试集 (267对，合成数据便于定量评估)
# ---------------------------------------------------------------

# general settings
name: Deraining_Oracle_Restormer
model_type: ImageCleanModel
scale: 1
num_gpu: 8  # 8x A100
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Deraining/Datasets/train/AllRain/target
    dataroot_lq: ./Deraining/Datasets/train/AllRain/input
    geometric_augs: true

    # Oracle: 训练集离线目标软标签
    target_labels_path: ./offline_features_v2/train_target_labels_7c.pt

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    ### -------------Progressive training--------------------------
    mini_batch_sizes: [8,5,4,2,1,1]
    iters: [60000,44000,32000,24000,24000,16000]
    gt_size: 384   # Max patch size for progressive training
    gt_sizes: [128,160,192,256,320,384]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./Deraining/Datasets/test/RainDS-Syn/target
    dataroot_lq: ./Deraining/Datasets/test/RainDS-Syn/input
    io_backend:
      type: disk

    # Oracle: 验证集标签 (验证时内置 RainPredictor 自动预测, 标签仅供分析用)
    target_labels_path: ./offline_features_v2/val_target_labels_7c.pt

# network structures
network_g:
  type: Restormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4,6,6,8]
  num_refinement_blocks: 4
  heads: [1,2,4,8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  num_rain_classes: 7

# WeatherRouter 已弃用，现改用 Restormer 内置 RainPredictor


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 200000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # Internal RainPredictor CE loss weight
  lambda_rain: 0.1

  # Split 200k iterations into two cycles.
  # 1st cycle: fixed 3e-4 LR for 60k iters.
  # 2nd cycle: cosine annealing (3e-4 to 1e-6) for 140k iters.
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [60000, 140000]
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses (纯 L1, 无 Router loss)
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 4e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 4e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
